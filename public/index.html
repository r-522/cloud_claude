<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Claude Chat</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- ログイン -->
    <section class="login" id="login-view">
      <div class="login-card">
        <h1>Claude Chat</h1>
        <p class="lead">続けるにはアクセスコードを入力してください。</p>
        <form id="login-form" autocomplete="off" novalidate>
          <label class="field" for="access-code">アクセスコード</label>
          <input
            id="access-code"
            name="access-code"
            type="password"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            required
          />
          <p class="hint">アルファベット大文字・小文字・記号を含む必要があります。</p>
          <button class="btn btn-primary btn-block" type="submit" id="login-submit">続ける</button>
          <p class="form-error" id="login-error" role="alert"></p>
        </form>
      </div>
    </section>

    <!-- チャット -->
    <section class="app" id="app-view" hidden>
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand">Claude Chat</div>
          <div class="control">
            <label for="model-select">モデル</label>
            <select id="model-select"></select>
          </div>
          <div class="control" id="effort-control">
            <label for="effort-select">推論量</label>
            <select id="effort-select"></select>
          </div>
          <button class="btn-quiet" type="button" id="new-chat">新しい会話</button>
          <button class="btn-quiet" type="button" id="logout">ログアウト</button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="messages-inner" id="messages-inner">
          <p class="empty" id="empty-state">メッセージを入力して会話を開始します。</p>
        </div>
      </div>

      <div class="composer">
        <div class="banner" id="error-banner" role="alert" hidden>
          <span id="error-text"></span>
          <button class="btn-quiet" type="button" id="error-dismiss">閉じる</button>
        </div>
        <form class="composer-inner" id="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="メッセージを入力（Markdown対応）"
            autocomplete="off"
            spellcheck="false"
          ></textarea>
          <div class="composer-bar">
            <span class="composer-hint" id="send-hint">Enterで送信 / Shift+Enterで改行</span>
            <button class="btn-quiet" type="button" id="copy-input">入力をコピー</button>
            <button class="btn btn-primary" type="submit" id="send">送信</button>
          </div>
        </form>
      </div>
    </section>

    <script type="module" src="/app.js"></script>
  </body>
</html>
